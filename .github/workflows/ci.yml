name: Manasitra AI Engine CI

on:
  push:
    branches: [ main, chore/**, feat/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Python Emotion Model Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Emotion Predictor Tests
        run: python tests/test_emotion_predictor.py
